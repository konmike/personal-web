<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontakt — Michal Konečný, frontend developer.">
  <meta property="og:title" content="Kontakt — Michal Konečný">
  <meta property="og:type" content="website">
  <title>Kontakt — Michal Konečný</title>
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="stylesheet" href="/src/scss/main.scss">
</head>
<body>
  <div class="site-wrapper">
    <header>
      <nav class="site-nav" aria-label="Hlavní navigace">
        <a href="/" class="site-nav__logo" aria-label="Domů">
          <img src="/img/coder-dark.webp" alt="Michal Konečný" width="36" height="36">
        </a>
        <ul class="site-nav__links" role="list">
          <li><a href="/">Projekty</a></li>
          <li><a href="/cv.html">CV</a></li>
          <li><a href="/contact.html" aria-current="page">Kontakt</a></li>
        </ul>
        <button
          class="site-nav__hamburger"
          id="menu-toggle"
          aria-label="Otevřít menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </header>
    <div class="hairline" aria-hidden="true"></div>

    <main class="site-content page-contact">
      <div class="contact-wrap">
        <h1>Máte zájem<br>o spolupráci?</h1>
        <p>Napiš mi a můžeme probrat projekt i technické detaily.</p>
        <div class="contact-actions">
          <a
            href="mailto:info@konecnymichal.cz"
            class="btn btn--primary"
          >info@konecnymichal.cz</a>
        </div>
        <div class="contact-actions">
          <a
            href="https://www.linkedin.com/in/michalkonecny/"
            class="btn btn--outline-dark"
            target="_blank"
            rel="noopener noreferrer"
          >LinkedIn</a>
          <a
            href="https://github.com/konmike"
            class="btn btn--outline-dark"
            target="_blank"
            rel="noopener noreferrer"
          >GitHub</a>
        </div>
      </div>
    </main>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobile-menu" role="dialog" aria-label="Mobilní menu">
    <div class="mobile-menu__top">
      <a href="/" class="logo" aria-label="Domů">
        <img src="/img/coder-white.webp" alt="Michal Konečný" width="36" height="36">
      </a>
      <button id="menu-close" aria-label="Zavřít menu">&times;</button>
    </div>
    <ul class="mobile-menu__links" role="list">
      <li><a href="/">Projekty</a></li>
      <li><a href="/cv.html">CV</a></li>
      <li><a href="/contact.html" aria-current="page">Kontakt</a></li>
    </ul>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
